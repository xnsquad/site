<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xnsquad - best rat squad</title>
<meta name="description" content="dsc.gg/xnraters">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  :root{
    --bg:#0a0a14;
    --bg-soft:#10101c;
    --card:#15152a;
    --border:rgba(196,181,253,.14);
    --border-hi:rgba(196,181,253,.55);
    --text:#f1f0f7;
    --muted:#a5a3bd;
    --p1:#a855f7;
    --p2:#c4b5fd;
    --p3:#e9d5ff;
    --grad:linear-gradient(135deg,#a855f7 0%,#c4b5fd 50%,#e9d5ff 100%);
    --grad-soft:linear-gradient(135deg,#7c3aed 0%,#a855f7 50%,#c4b5fd 100%);
    --grad-text:linear-gradient(135deg,#c4b5fd 0%,#d8b4fe 40%,#e9d5ff 100%);
    --radius:18px;
  }

  html{scroll-behavior:smooth}

  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }

  h1,h2,h3,.logo,.btn{font-family:'Space Grotesk',system-ui,sans-serif}

  ::selection{background:rgba(196,181,253,.35);color:#fff}

  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-track{background:#0a0a14}
  ::-webkit-scrollbar-thumb{background:linear-gradient(#a855f7,#e9d5ff);border-radius:10px;border:3px solid #0a0a14}

  .nav{
    position:fixed;top:0;left:0;right:0;z-index:200;
    padding:20px 0;transition:all .35s ease;
  }
  .nav.scrolled{
    padding:12px 0;
    background:rgba(10,10,20,.85);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
  }
  .nav-inner{
    max-width:1240px;margin:0 auto;padding:0 24px;
    display:flex;align-items:center;justify-content:space-between;gap:20px;
  }
  .logo{
    font-size:20px;font-weight:700;letter-spacing:.06em;
    text-decoration:none;white-space:nowrap;
    background:linear-gradient(135deg,#a855f7 0%,#c4b5fd 50%,#e9d5ff 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .logo span{
    background:linear-gradient(135deg,#c4b5fd,#e9d5ff);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .nav-links{display:flex;align-items:center;gap:34px}
  .nav-links a{
    position:relative;color:var(--muted);text-decoration:none;
    font-size:14.5px;font-weight:500;letter-spacing:.02em;transition:color .25s;
  }
  .nav-links a::after{
    content:'';position:absolute;left:0;bottom:-6px;height:2px;width:0;
    background:var(--grad);border-radius:2px;transition:width .3s ease;
  }
  .nav-links a:hover{color:#fff}
  .nav-links a:hover::after{width:100%}

  .burger{
    display:none;background:none;border:0;cursor:pointer;
    width:40px;height:40px;flex-direction:column;justify-content:center;
    align-items:center;gap:5px;border-radius:10px;
  }
  .burger span{
    display:block;width:22px;height:2px;background:#fff;border-radius:2px;
    transition:.3s;
  }
  .burger.active span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .burger.active span:nth-child(2){opacity:0}
  .burger.active span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

  .hero{
    position:relative;min-height:100svh;
    display:flex;align-items:center;justify-content:center;
    text-align:center;padding:120px 24px 80px;overflow:hidden;
  }
  .grid-bg{
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(196,181,253,.07) 1px,transparent 1px),
      linear-gradient(90deg,rgba(196,181,253,.07) 1px,transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 10%,transparent 78%);
    mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 10%,transparent 78%);
    animation:gridDrift 22s linear infinite;
  }
  @keyframes gridDrift{
    from{background-position:0 0,0 0}
    to{background-position:64px 64px,64px 64px}
  }
  .glow{
    position:absolute;border-radius:50%;filter:blur(120px);
    opacity:.45;pointer-events:none;
  }
  .glow.g1{width:520px;height:520px;background:#7c3aed;top:-140px;left:-120px;animation:float1 14s ease-in-out infinite}
  .glow.g2{width:460px;height:460px;background:#a855f7;bottom:-160px;right:-100px;animation:float2 17s ease-in-out infinite}
  @keyframes float1{50%{transform:translate(70px,60px) scale(1.12)}}
  @keyframes float2{50%{transform:translate(-60px,-50px) scale(1.08)}}

  .hero-inner{position:relative;z-index:2;max-width:1000px}

  .hero-title{
    font-size:clamp(3.4rem,15vw,10.5rem);
    font-weight:700;line-height:.88;letter-spacing:-.045em;
    background:linear-gradient(100deg,#7c3aed 0%,#a855f7 25%,#c4b5fd 50%,#d8b4fe 75%,#e9d5ff 100%);
    background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shine 7s ease-in-out infinite;
    filter:drop-shadow(0 0 60px rgba(168,85,247,.55));
  }
  @keyframes shine{
    0%,100%{background-position:0% 50%}
    50%{background-position:100% 50%}
  }

  .hero-btns{
    display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:48px;
  }

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    padding:15px 34px;border-radius:999px;
    font-size:15px;font-weight:600;letter-spacing:.02em;
    text-decoration:none;cursor:pointer;border:1px solid transparent;
    transition:transform .25s ease,box-shadow .3s ease,background .3s ease,color .3s;
    position:relative;overflow:hidden;
  }
  .btn-primary{
    background:linear-gradient(135deg,#7c3aed 0%,#a855f7 50%,#c4b5fd 100%);
    color:#fff;
    box-shadow:0 10px 34px -10px rgba(168,85,247,.9);
    border:1px solid rgba(233,213,255,.3);
  }
  .btn-primary:hover{
    transform:translateY(-3px);
    box-shadow:0 18px 44px -12px rgba(196,181,253,.95);
    background:linear-gradient(135deg,#a855f7 0%,#c4b5fd 50%,#e9d5ff 100%);
  }

  .ticker{
    border-top:1px solid var(--border);border-bottom:1px solid var(--border);
    background:var(--bg-soft);overflow:hidden;padding:18px 0;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
  }
  .ticker-track{
    display:flex;width:max-content;gap:44px;
    animation:scrollX 28s linear infinite;
  }
  .ticker-track span{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;font-weight:600;letter-spacing:.22em;
    text-transform:uppercase;color:#a855f7;white-space:nowrap;
  }
  .ticker-track span:nth-child(even){
    background:linear-gradient(135deg,#c4b5fd,#e9d5ff);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  @keyframes scrollX{to{transform:translateX(-50%)}}

  section{position:relative}
  .container{max-width:1240px;margin:0 auto;padding:0 24px}

  .section-pad{padding:120px 0}

  .section-head{margin-bottom:64px;max-width:660px}
  .section-title{
    font-size:clamp(2rem,4.6vw,3.4rem);
    font-weight:700;letter-spacing:-.03em;line-height:1.08;
  }
  .section-title em{
    font-style:normal;
    background:linear-gradient(135deg,#c4b5fd 0%,#d8b4fe 50%,#e9d5ff 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 30px rgba(168,85,247,.4));
  }

  .admins-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:28px;
    max-width:820px;
    margin:0 auto;
  }
  .admin{
    position:relative;padding:44px 28px 36px;border-radius:var(--radius);
    border:1px solid var(--border);background:var(--card);
    overflow:hidden;text-align:center;
    transition:transform .4s cubic-bezier(.2,.8,.2,1),border-color .35s,box-shadow .35s;
  }
  .admin::before{
    content:'';position:absolute;inset:0;opacity:0;transition:opacity .4s;
    background:radial-gradient(circle at 50% 0%,rgba(196,181,253,.20),transparent 65%);
    pointer-events:none;
  }
  .admin:hover{
    transform:translateY(-8px);
    border-color:var(--border-hi);
    box-shadow:0 20px 50px -20px rgba(168,85,247,.6);
  }
  .admin:hover::before{opacity:1}

  .admin-avatar{
    position:relative;
    width:132px;height:132px;border-radius:50%;
    margin:0 auto 22px;
    padding:3px;
    background:linear-gradient(135deg,#a855f7,#c4b5fd,#e9d5ff);
    box-shadow:0 14px 40px -12px rgba(168,85,247,.9);
    transition:transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .admin:hover .admin-avatar{transform:scale(1.06)}
  .admin-avatar img{
    width:100%;height:100%;border-radius:50%;
    object-fit:cover;display:block;
    background:#15152a;
  }

  .admin h3{
    font-size:22px;font-weight:700;letter-spacing:-.01em;
    background:linear-gradient(135deg,#c4b5fd 0%,#d8b4fe 50%,#e9d5ff 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  .join-card{
    position:relative;border-radius:26px;padding:70px 40px;text-align:center;
    background:
      radial-gradient(circle at 20% 10%,rgba(168,85,247,.28),transparent 55%),
      radial-gradient(circle at 85% 90%,rgba(196,181,253,.22),transparent 55%),
      var(--bg-soft);
    border:1px solid var(--border);overflow:hidden;
  }
  .join-card::after{
    content:'';position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(196,181,253,.07) 1px,transparent 1px),
      linear-gradient(90deg,rgba(196,181,253,.07) 1px,transparent 1px);
    background-size:50px 50px;
    -webkit-mask-image:radial-gradient(ellipse at center,#000,transparent 72%);
    mask-image:radial-gradient(ellipse at center,#000,transparent 72%);
    pointer-events:none;
  }
  .join-card > *{position:relative;z-index:2}
  .join-card h2{
    font-size:clamp(1.8rem,4vw,2.9rem);font-weight:700;
    letter-spacing:-.03em;line-height:1.12;
    color:#e9d5ff;
  }
  .join-card h2 em{
    font-style:normal;
    background:linear-gradient(135deg,#c4b5fd 0%,#d8b4fe 50%,#e9d5ff 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 25px rgba(168,85,247,.5));
  }

  footer{
    border-top:1px solid var(--border);
    padding:50px 0 34px;margin-top:40px;
  }
  .footer-inner{
    display:flex;justify-content:space-between;align-items:center;
    gap:26px;flex-wrap:wrap;
  }
  .footer-inner p{font-size:13.5px;color:var(--muted)}
  .socials{display:flex;gap:12px}
  .social{
    width:42px;height:42px;border-radius:12px;
    display:grid;place-items:center;text-decoration:none;
    border:1px solid var(--border);background:rgba(255,255,255,.03);
    color:#c4b5fd;font-size:12.5px;font-weight:700;letter-spacing:.04em;
    font-family:'Space Grotesk',sans-serif;
    transition:.3s;
  }
  .social:hover{
    color:#fff;border-color:var(--border-hi);
    background:rgba(168,85,247,.25);transform:translateY(-3px);
    box-shadow:0 10px 25px -10px rgba(168,85,247,.8);
  }

  .reveal{
    opacity:0;transform:translateY(34px);
    transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1);
  }
  .reveal.visible{opacity:1;transform:none}

  @media (max-width:768px){
    .burger{display:flex}
    .nav-links{
      position:fixed;inset:0 0 0 auto;width:min(78vw,320px);
      flex-direction:column;justify-content:center;gap:34px;
      background:rgba(16,16,28,.98);
      backdrop-filter:blur(20px);
      border-left:1px solid var(--border);
      transform:translateX(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);
      z-index:150;
    }
    .nav-links.open{transform:translateX(0)}
    .nav-links a{font-size:20px;color:#fff}
    .burger{z-index:200}
    .section-pad{padding:84px 0}
    .join-card{padding:52px 24px}
    .hero-btns .btn{width:100%;max-width:320px}
  }

  @media (max-width:480px){
    .footer-inner{flex-direction:column;text-align:center}
    .admins-grid{grid-template-columns:1fr}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
    .reveal{opacity:1;transform:none}
  }
</style>
</head>
<body>

<header class="nav" id="nav">
  <div class="nav-inner">
    <a href="#home" class="logo">XN<span>SQUAD</span></a>
    <nav class="nav-links" id="navLinks">
      <a href="#admins">Админы</a>
      <a href="#join">Вступить</a>
    </nav>
    <button class="burger" id="burger" aria-label="Открыть меню">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<section class="hero" id="home">
  <div class="grid-bg"></div>
  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <div class="hero-inner">
    <h1 class="hero-title">XNSQUAD</h1>
    <div class="hero-btns">
      <a href="https://dsc.gg/xnraters" target="_blank" rel="noopener" class="btn btn-primary">Вступить в сквад</a>
    </div>
  </div>
</section>

<div class="ticker">
  <div class="ticker-track" id="ticker">
    <span>XNSQUAD</span><span>★</span>
    <span>RATING</span><span>★</span>
    <span>TOP TIER</span><span>★</span>
  </div>
</div>

<section class="section-pad" id="admins">
  <div class="container">
    <div class="section-head reveal">
      <h2 class="section-title"><em>Админы</em></h2>
    </div>

    <div class="admins-grid">

      <article class="admin reveal">
        <div class="admin-avatar">
          <img src="avatarka1.png" alt="helize">
        </div>
        <h3>helize</h3>
      </article>

      <article class="admin reveal">
        <div class="admin-avatar">
          <img src="avatarka2.png" alt="tylench1kx">
        </div>
        <h3>tylench1kx</h3>
      </article>

    </div>
  </div>
</section>

<section class="section-pad" id="join">
  <div class="container">
    <div class="join-card reveal">
      <h2>Хочешь в <em>XNSQUAD</em>?</h2>

      <div style="margin-top:38px">
        <a href="https://dsc.gg/xnraters" target="_blank" rel="noopener" class="btn btn-primary">Зайти в сквад</a>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="footer-inner">
      <div>
        <a href="#home" class="logo">XN<span>SQUAD</span></a>
        <p style="margin-top:10px">© <span id="year"></span> XNSQUAD. Все права защищены.</p>
      </div>
      <div class="socials">
        <a href="https://dsc.gg/xnraters" target="_blank" rel="noopener" class="social" title="Discord">DC</a>
        <a href="#" class="social" title="Telegram">TG</a>
        <a href="#" class="social" title="YouTube">YT</a>
        <a href="#" class="social" title="Twitch">TW</a>
      </div>
    </div>
  </div>
</footer>

<script>
  const nav = document.getElementById('nav');
  const onScroll = () => nav.classList.toggle('scrolled', window.scrollY > 40);
  onScroll();
  window.addEventListener('scroll', onScroll, { passive: true });

  const burger = document.getElementById('burger');
  const navLinks = document.getElementById('navLinks');

  burger.addEventListener('click', () => {
    burger.classList.toggle('active');
    navLinks.classList.toggle('open');
    document.body.style.overflow = navLinks.classList.contains('open') ? 'hidden' : '';
  });

  navLinks.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      burger.classList.remove('active');
      navLinks.classList.remove('open');
      document.body.style.overflow = '';
    });
  });

  const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add('visible'), i * 90);
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });

  document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

  const ticker = document.getElementById('ticker');
  ticker.innerHTML += ticker.innerHTML;

  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
